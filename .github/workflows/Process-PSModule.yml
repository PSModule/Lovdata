name: Process-PSModule

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - main
      # Bootstrap integration branch: follow-up function pull requests target it until the first release.
      # https://psmodule.github.io/docs/Modules/Process-PSModule/module-bootstrap/
      - build-lovdata-module
    types:
      - closed
      - opened
      - reopened
      - synchronize
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  statuses: write
  pages: write
  id-token: write

jobs:
  Process-PSModule:
    uses: PSModule/Process-PSModule/.github/workflows/workflow.yml@fix/434-empty-release-list # TEMPORARY: validating the fix for PSModule/Process-PSModule#434; revert to a pinned release before this PR is marked ready.
    secrets:
      APIKey: ${{ secrets.APIKEY }}
